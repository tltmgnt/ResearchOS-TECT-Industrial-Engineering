[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos-tect"
version = "0.1.0"
description = "Experimental epistemic control and assurance infrastructure"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
researchos = "researchos.server:main"

[tool.setuptools.package-data]
researchos = ["static/*"]

[tool.setuptools.packages.find]
include = ["researchos*"]
